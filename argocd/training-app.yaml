apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spam-detector-training
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Josephgit2025/mlops-spam-detector.git'
    targetRevision: HEAD
    path: k8s/training
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true