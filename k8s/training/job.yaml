apiVersion: batch/v1
kind: Job
metadata:
  name: spam-detector-training
spec:
  template:
    spec:
      containers:
        - name: trainer
          image: josephmariebile/spam-detector:latest
          command: ["python", "src/train.py"]
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: MLFLOW_TRACKING_URI
      restartPolicy: Never
  backoffLimit: 3