apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spam-detector
  template:
    metadata:
      labels:
        app: spam-detector
    spec:
      containers:
        - name: spam-detector
          image: josephmariebile/spam-detector:0bda7a81ac3d87e8457ad181b1118c08af446f22
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: spam-detector-config
