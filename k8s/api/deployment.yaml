apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spam-detector
  template:
    metadata:
      labels:
        app: spam-detector
    spec:
      containers:
        - name: spam-detector
          image: josephmariebile/spam-detector:b8ce26c35a2bc01d18d8aab6210af0fb91991ffc
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: spam-detector-config
